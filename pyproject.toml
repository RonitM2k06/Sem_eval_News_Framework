[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "narrativegraph"
version = "1.0.0"
description = "Evidence-Grounded Multilingual Narrative Understanding through Entity-Role-Evidence-Narrative Reasoning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "NarrativeGraph Team"}
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
